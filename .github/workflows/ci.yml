name: CI

# The app uses Windows-only APIs, so everything runs on Windows.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.rs'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.rs'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked

  # The oldest Rust declared in Cargo.toml (`rust-version`) must still build the project
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
